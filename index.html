<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Microfone - Cadastro de Tarefas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6 text-center">
    <h1 class="text-lg font-bold text-slate-800 mb-2">Fale para preencher o formulário</h1>
    <p class="text-slate-500 text-sm mb-6">Clique no microfone, fale a frase completa e aguarde. Esta janela fecha sozinha ao final.</p>

    <button type="button" id="micBtn"
      class="mx-auto flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 hover:bg-indigo-200 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <p id="status" class="text-sm text-slate-500 mt-4">Clique para começar</p>
    <div id="transcript" class="hidden mt-4 p-3 rounded-lg bg-slate-50 text-slate-700 text-sm italic"></div>
    <button type="button" id="closeBtn" class="hidden mt-4 text-sm text-indigo-600 underline">Fechar janela</button>
  </div>

<script>
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const closeBtn = document.getElementById('closeBtn');

  // O formulário que abriu esta janela manda o token e a própria URL
  // dele nos parâmetros da URL, para sabermos para onde enviar o texto.
  const params = new URLSearchParams(window.location.search);
  const TOKEN = params.get('token');
  const APP_URL = params.get('appUrl');

  const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!TOKEN || !APP_URL) {
    statusEl.textContent = 'Esta janela precisa ser aberta a partir do formulário de cadastro.';
    if (micBtn) { micBtn.disabled = true; micBtn.classList.add('opacity-40', 'cursor-not-allowed'); }
  } else if (!SpeechRecognitionApi) {
    statusEl.textContent = 'Este navegador não suporta reconhecimento de voz. Use o Google Chrome.';
    micBtn.disabled = true;
    micBtn.classList.add('opacity-40', 'cursor-not-allowed');
  } else {
    const recognition = new SpeechRecognitionApi();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      statusEl.textContent = 'Ouvindo...';
      micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
      micBtn.classList.remove('bg-indigo-100', 'text-indigo-600');
    };

    recognition.onend = function () {
      micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
      micBtn.classList.add('bg-indigo-100', 'text-indigo-600');
    };

    recognition.onerror = function (event) {
      statusEl.textContent = 'Erro: ' + event.error + '. Clique no microfone para tentar de novo.';
    };

    recognition.onresult = function (event) {
      const transcript = event.results[0][0].transcript;
      statusEl.textContent = 'Entendi! Enviando de volta para o formulário...';
      transcriptEl.textContent = '"' + transcript + '"';
      transcriptEl.classList.remove('hidden');

      const separador = APP_URL.indexOf('?') === -1 ? '?' : '&';
      const urlEnvio = APP_URL + separador + 'action=salvarVoz' +
        '&token=' + encodeURIComponent(TOKEN) +
        '&texto=' + encodeURIComponent(transcript);

      // "no-cors": não precisamos ler a resposta, só garantir que o
      // Apps Script recebeu o texto e guardou para o formulário buscar.
      fetch(urlEnvio, { mode: 'no-cors' })
        .catch(function () { /* mesmo com erro de leitura, a requisição pode ter chegado */ })
        .finally(function () {
          statusEl.textContent = 'Prontinho! Pode fechar esta janela.';
          closeBtn.classList.remove('hidden');
          setTimeout(function () { window.close(); }, 800);
        });
    };

    micBtn.addEventListener('click', function () {
      recognition.start();
    });
  }

  closeBtn.addEventListener('click', function () { window.close(); });
</script>

</body>
</html>
