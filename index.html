<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Microfone - Cadastro de Tarefas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6 text-center">
    <h1 class="text-lg font-bold text-slate-800 mb-2">Fale para preencher o formulário</h1>
    <p class="text-slate-500 text-sm mb-6">Clique no microfone, fale a frase completa (pode fazer pausas) e depois clique em "Concluído".</p>

    <button type="button" id="micBtn"
      class="mx-auto flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600 hover:bg-indigo-200 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <p id="status" class="text-sm text-slate-500 mt-4">Clique para começar</p>
    <div id="transcript" class="hidden mt-4 p-3 rounded-lg bg-slate-50 text-slate-700 text-sm italic text-left"></div>

    <button type="button" id="concluirBtn"
      class="hidden mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
      Concluído
    </button>

    <button type="button" id="closeBtn" class="hidden mt-4 text-sm text-indigo-600 underline">Fechar janela</button>
  </div>

<script>
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const concluirBtn = document.getElementById('concluirBtn');
  const closeBtn = document.getElementById('closeBtn');

  // O formulário que abriu esta janela manda o token e a própria URL
  // dele nos parâmetros da URL, para sabermos para onde enviar o texto.
  const params = new URLSearchParams(window.location.search);
  const TOKEN = params.get('token');
  const APP_URL = params.get('appUrl');

  const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;

  let segmentosConcluidos = [];   // trechos finais de sessões já encerradas (por causa de reinícios automáticos)
  let resultadosSessaoAtual = []; // trechos finais da sessão de escuta atual, indexados pela própria API
  let ouvindo = false;
  let usuarioConcluiu = false;

  function textoAcumulado_() {
    return segmentosConcluidos.concat(resultadosSessaoAtual).join(' ').replace(/\s+/g, ' ').trim();
  }

  /** Registra um trecho final reconhecido. Se ele for apenas uma versão mais
   *  completa do último trecho já guardado (comportamento comum no Android,
   *  que reenvia o texto crescendo do zero), substitui em vez de somar. Caso
   *  contrário (comportamento comum no desktop), adiciona como trecho novo. */
  function adicionarResultadoFinal_(novoTexto) {
    const novo = (novoTexto || '').trim();
    if (!novo) return;

    const ultimoIndice = resultadosSessaoAtual.length - 1;
    const anterior = ultimoIndice >= 0 ? resultadosSessaoAtual[ultimoIndice].trim() : '';

    if (anterior && novo.toLowerCase().indexOf(anterior.toLowerCase()) === 0) {
      resultadosSessaoAtual[ultimoIndice] = novo; // é o mesmo trecho, só mais completo
    } else {
      resultadosSessaoAtual.push(novo); // é um trecho realmente novo
    }
  }

  if (!TOKEN || !APP_URL) {
    statusEl.textContent = 'Esta janela precisa ser aberta a partir do formulário de cadastro.';
    micBtn.disabled = true;
    micBtn.classList.add('opacity-40', 'cursor-not-allowed');
  } else if (!SpeechRecognitionApi) {
    statusEl.textContent = 'Este navegador não suporta reconhecimento de voz. Use o Google Chrome.';
    micBtn.disabled = true;
    micBtn.classList.add('opacity-40', 'cursor-not-allowed');
  } else {
    const recognition = new SpeechRecognitionApi();
    recognition.lang = 'pt-BR';
    recognition.continuous = true;      // continua escutando mesmo com pausas
    recognition.interimResults = true;  // mostra o texto sendo formado em tempo real
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      ouvindo = true;
      statusEl.textContent = 'Ouvindo... fale a frase completa e clique em "Concluído" quando terminar.';
      micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
      micBtn.classList.remove('bg-indigo-100', 'text-indigo-600');
      concluirBtn.classList.remove('hidden');
    };

    recognition.onend = function () {
      ouvindo = false;
      micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
      micBtn.classList.add('bg-indigo-100', 'text-indigo-600');

      if (usuarioConcluiu) {
        // O usuário clicou em "Concluído": envia tudo o que foi reconhecido
        // (juntando as sessões, caso tenha havido reinícios automáticos).
        concluirBtn.classList.add('hidden');
        const textoFinal = textoAcumulado_();
        if (textoFinal) enviarTranscricao_(textoFinal);
      } else {
        // O navegador encerrou a escuta sozinho (comum no Android). Antes de
        // reiniciar, guarda o que já foi reconhecido nesta sessão, porque a
        // próxima sessão vai recomeçar a contagem de resultados do zero.
        if (resultadosSessaoAtual.length) {
          segmentosConcluidos = segmentosConcluidos.concat(resultadosSessaoAtual);
          resultadosSessaoAtual = [];
        }
        statusEl.textContent = 'Ainda ouvindo... (retomando automaticamente)';
        setTimeout(function () {
          try { recognition.start(); } catch (e) { /* já iniciando, ignora */ }
        }, 150);
      }
    };

    recognition.onerror = function (event) {
      if (event.error === 'no-speech') return; // silêncio breve, ignora e continua
      statusEl.textContent = 'Erro: ' + event.error + '. Clique no microfone para tentar de novo.';
    };

    recognition.onresult = function (event) {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const resultado = event.results[i];
        if (resultado.isFinal) {
          adicionarResultadoFinal_(resultado[0].transcript);
        } else {
          interim += resultado[0].transcript;
        }
      }
      transcriptEl.textContent = '"' + (textoAcumulado_() + ' ' + interim).trim() + '"';
      transcriptEl.classList.remove('hidden');
    };

    micBtn.addEventListener('click', function () {
      if (!ouvindo) {
        segmentosConcluidos = [];
        resultadosSessaoAtual = [];
        usuarioConcluiu = false;
        transcriptEl.classList.add('hidden');
        closeBtn.classList.add('hidden');
        recognition.start();
      }
    });

    concluirBtn.addEventListener('click', function () {
      usuarioConcluiu = true;
      recognition.stop(); // isso dispara onend, que envia o texto acumulado
    });
  }

  function enviarTranscricao_(transcript) {
    statusEl.textContent = 'Enviando de volta para o formulário...';

    const separador = APP_URL.indexOf('?') === -1 ? '?' : '&';
    const urlEnvio = APP_URL + separador + 'action=salvarVoz' +
      '&token=' + encodeURIComponent(TOKEN) +
      '&texto=' + encodeURIComponent(transcript);

    // "no-cors": não precisamos ler a resposta, só garantir que o
    // Apps Script recebeu o texto e guardou para o formulário buscar.
    fetch(urlEnvio, { mode: 'no-cors' })
      .catch(function () { /* mesmo com erro de leitura, a requisição pode ter chegado */ })
      .finally(function () {
        statusEl.textContent = 'Prontinho! Confira o formulário e feche esta janela.';
        closeBtn.classList.remove('hidden');
        // Não fecha mais sozinha - o usuário confirma clicando em "Fechar janela"
      });
  }

  closeBtn.addEventListener('click', function () { window.close(); });
</script>

</body>
</html>
